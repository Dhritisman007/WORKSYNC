# Illustrative AML/KYC checks for onboarding. Every rule is `verified:
# false` and cites only general guidance documents, never a specific
# clause/circular number, per the brief's "never invent circular or clause
# numbers" instruction. Conditions reference the engineered features from
# verticals/kyc_aml/adapter.py, matched against SYNTHETIC PEP/sanctions
# lists generated by data_gen.py — none of this is a real watchlist.
version: "0.1.0"
vertical: kyc_aml

rules:
  - id: KYC-SANCTIONS-001
    description: >
      Applicant name matches an entry on the (synthetic) sanctions list —
      onboarding must not proceed automatically.
    source_regulation: >
      Prevention of Money Laundering Act (PMLA) sanctions-screening
      obligation before onboarding a customer (general reference — specific
      section not yet verified against the current PMLA Rules)
    severity: hard
    verified: false
    action: reject
    condition:
      field: sanctions_match
      op: eq
      value: true

  - id: KYC-PEP-001
    description: >
      Applicant name matches an entry on the (synthetic) PEP list —
      enhanced due diligence is required before this account can be
      approved automatically.
    source_regulation: >
      RBI KYC Master Direction's enhanced due diligence requirement for
      politically exposed persons (general reference — specific clause not
      yet verified)
    severity: hard
    verified: false
    action: escalate
    condition:
      field: pep_match
      op: eq
      value: true

  - id: KYC-DOC-001
    description: >
      Identity document quality/verification score is too low to reliably
      confirm the applicant's identity.
    source_regulation: >
      RBI KYC Master Direction requirement to verify identity using
      officially valid documents before onboarding (general reference —
      specific clause not yet verified)
    severity: hard
    verified: false
    action: escalate
    condition:
      field: document_quality_score
      op: lt
      value: 0.4

  - id: KYC-ADVERSE-001
    description: >
      An adverse media screening hit was recorded for this applicant.
    source_regulation: >
      General AML adverse-media screening practice (illustrative only — not
      tied to a specific RBI/PMLA clause; not yet verified)
    severity: soft
    verified: false
    action: annotate
    condition:
      field: adverse_media_hit
      op: eq
      value: true

  - id: KYC-VELOCITY-001
    description: >
      Unusually high application velocity from the same device/session in
      24 hours — a common synthetic-identity-fraud-ring signal.
    source_regulation: >
      General fraud-monitoring practice (illustrative only — not tied to a
      specific RBI/PMLA clause; not yet verified)
    severity: soft
    verified: false
    action: annotate
    condition:
      field: application_velocity_24h
      op: gt
      value: 2
