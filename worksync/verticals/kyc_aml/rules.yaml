# AML/KYC onboarding rules. `basis` / `verified` follow the same convention
# as verticals/loan/rules.yaml: regulation rules cite the section as copied
# from the regulator's official text (re-check at `reference_url`);
# internal_policy rules are thresholds the team owns. Conditions reference
# the engineered features in verticals/kyc_aml/adapter.py, matched against
# SYNTHETIC PEP/sanctions lists generated by data_gen.py — none of this is a
# real watchlist.
version: "0.2.0"
vertical: kyc_aml

rules:
  - id: KYC-SANCTIONS-001
    description: >
      Applicant name matches an entry on the (synthetic) sanctions list —
      onboarding must not proceed automatically.
    source_regulation: >
      RBI Master Direction – KYC Direction, 2016 (updated 14 Aug 2025),
      Section 10 (customer identity must not match any name on the sanctions
      lists in Chapter IX) and Section 51(a) (no account for individuals or
      entities on the UNSC lists, per Section 51A of the UAPA, 1967).
    severity: hard
    basis: regulation
    verified: true
    reference_url: https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=11566
    verified_on: "2026-10-06"
    action: reject
    condition:
      field: sanctions_match
      op: eq
      value: true

  - id: KYC-PEP-001
    description: >
      Applicant name matches an entry on the (synthetic) PEP list —
      enhanced due diligence is required before this account can be
      approved automatically.
    source_regulation: >
      RBI Master Direction – KYC Direction, 2016 (updated 14 Aug 2025),
      Section 41 — accounts of Politically Exposed Persons need enhanced due
      diligence, including senior-management approval to open the account
      and establishing the source of funds/wealth.
    severity: hard
    basis: regulation
    verified: true
    reference_url: https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=11566
    verified_on: "2026-10-06"
    action: escalate
    condition:
      field: pep_match
      op: eq
      value: true

  - id: KYC-DOC-001
    description: >
      Identity document quality/verification score is too low to reliably
      confirm the applicant's identity.
    source_regulation: >
      RBI Master Direction – KYC Direction, 2016 (updated 14 Aug 2025),
      Section 16 — identity must be established from Aadhaar / an Officially
      Valid Document during CDD. The 0.4 score cut-off is our own.
    severity: hard
    basis: regulation
    verified: true
    reference_url: https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=11566
    verified_on: "2026-10-06"
    action: escalate
    condition:
      field: document_quality_score
      op: lt
      value: 0.4

  - id: KYC-ADVERSE-001
    description: >
      An adverse media screening hit was recorded for this applicant.
    source_regulation: >
      Internal AML policy — adverse-media screening is common practice but
      is not a named requirement in the RBI KYC Master Direction.
    severity: soft
    basis: internal_policy
    action: annotate
    condition:
      field: adverse_media_hit
      op: eq
      value: true

  - id: KYC-VELOCITY-001
    description: >
      Unusually high application velocity from the same device/session in
      24 hours — a common synthetic-identity-fraud-ring signal.
    source_regulation: >
      Internal fraud policy (threshold: more than 2 applications in 24h).
      Related: RBI KYC Master Direction Section 36 requires monitoring of
      activity with unusual patterns, but sets no velocity limit.
    severity: soft
    basis: internal_policy
    reference_url: https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=11566
    action: annotate
    condition:
      field: application_velocity_24h
      op: gt
      value: 2
