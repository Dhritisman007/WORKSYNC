# Credit card/BNPL rules. Both are internal_policy: no RBI direction sets a
# transaction-amount threshold for this kind of review, so there is no
# citation to verify — the team owns these numbers. Same `basis` convention
# as verticals/loan/rules.yaml.
#
# Only `amount` is used here (not `hour_of_day` or any `v*` column): the
# dataset's V1-V28 are PCA components with no recoverable business meaning,
# so writing a "rule" against them would be inventing a justification for
# an opaque number — the model (which is allowed to be opaque) handles
# those signals instead; the rules engine only touches interpretable fields.
version: "0.2.0"
vertical: bnpl

rules:
  - id: BNPL-AMOUNT-001
    description: >
      Transaction amount exceeds 10,000 — should not be auto-approved
      regardless of the model's score.
    source_regulation: >
      Internal credit/fraud policy — high-value auto-approval ceiling
      (10,000). Not prescribed by any RBI direction.
    severity: hard
    basis: internal_policy
    action: escalate
    condition:
      field: amount
      op: gt
      value: 10000

  - id: BNPL-AMOUNT-002
    description: >
      Transaction amount exceeds 2,000 — large enough to warrant a note in
      the decision trail even if not auto-blocking.
    source_regulation: >
      Internal monitoring policy — large-transaction annotation threshold
      (2,000). Not prescribed by any RBI direction.
    severity: soft
    basis: internal_policy
    action: annotate
    condition:
      field: amount
      op: gt
      value: 2000
