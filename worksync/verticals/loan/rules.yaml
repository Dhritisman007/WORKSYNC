# Loan-vertical compliance rules. Each rule declares its `basis`:
#   regulation       — implements a requirement in a named RBI direction.
#                      `verified: true` means the cited paragraph was read in
#                      the regulator's official text on `verified_on`, at
#                      `reference_url` — re-check it there before relying on it.
#   internal_policy  — a risk-appetite threshold no regulation prescribes
#                      (nothing to verify; the team owns the number).
# Clause numbers below were copied from the official text, not recalled.
# Conditions reference the engineered features in verticals/loan/adapter.py.
version: "0.2.0"
vertical: loan

rules:
  - id: LOAN-KYC-001
    description: >
      Insufficient data to assess creditworthiness (no credit-bureau
      external score and no stated occupation) — should not be auto-decided
      either way.
    source_regulation: >
      RBI (Digital Lending) Directions, 2025 (RBI/2025-26/36, 8 May 2025),
      Chapter III, para 7(i) — before extending any loan the RE must obtain
      the borrower's economic profile, at a minimum age, occupation and
      income, to assess creditworthiness.
    severity: hard
    basis: regulation
    verified: true
    reference_url: https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=12848
    verified_on: "2026-10-06"
    action: escalate
    condition:
      all:
        - not:
            field: ext_source_mean
            op: exists
        - not:
            field: occupation_type
            op: exists

  - id: LOAN-DTI-001
    description: >
      Annuity-to-income ratio exceeds 0.6 — debt burden appears
      unsustainable relative to income.
    source_regulation: >
      Internal credit policy. The 0.6 cap is our risk appetite — RBI's
      Digital Lending Directions, 2025 require a creditworthiness assessment
      (para 7(i)) but prescribe no debt-to-income limit.
    severity: hard
    basis: internal_policy
    reference_url: https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=12848
    action: reject
    condition:
      field: annuity_income_ratio
      op: gt
      value: 0.6

  - id: LOAN-AGE-001
    description: >
      Applicant is under 21 — extra scrutiny expected before extending
      unsecured digital credit to a very young applicant.
    source_regulation: >
      Internal credit policy. Age must be captured under RBI Digital Lending
      Directions, 2025 para 7(i), but no RBI direction sets a minimum age of
      21 — the threshold is ours.
    severity: hard
    basis: internal_policy
    reference_url: https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=12848
    action: escalate
    condition:
      field: age_years
      op: lt
      value: 21

  - id: LOAN-LEV-001
    description: >
      Credit-to-income ratio exceeds 8x — applicant appears highly
      leveraged relative to stated income; worth a human look even if the
      model score alone wouldn't flag it.
    source_regulation: >
      Internal credit policy — over-leverage review threshold (8x). Not
      prescribed by any RBI direction.
    severity: soft
    basis: internal_policy
    action: annotate
    condition:
      field: credit_income_ratio
      op: gt
      value: 8

  - id: LOAN-DOC-001
    description: >
      Standard supporting identity document (FLAG_DOCUMENT_3 in the source
      data) was not provided with the application.
    source_regulation: >
      RBI Master Direction – Know Your Customer (KYC) Direction, 2016
      (updated 14 Aug 2025), Section 16 — for CDD of an individual the RE
      must obtain proof of identity and address (Aadhaar / an Officially
      Valid Document) and PAN or Form 60.
    severity: soft
    basis: regulation
    verified: true
    reference_url: https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=11566
    verified_on: "2026-10-06"
    action: annotate
    condition:
      field: doc3_provided
      op: eq
      value: false
