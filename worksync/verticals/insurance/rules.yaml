# Motor-claims rules. IRDAI's Insurance Fraud Monitoring Framework
# Guidelines, 2025 (para 5.4.1) require every insurer to identify Red Flag
# Indicators for its own lines of business and build them into operations —
# the regulation mandates RFIs but leaves the specific indicators to the
# insurer. Rules below that are fraud RFIs cite that paragraph (checked in
# the official PDF); the indicator and its threshold are still our choice.
# Same `basis` convention as verticals/loan/rules.yaml. Conditions reference
# the engineered features in verticals/insurance/adapter.py, including the
# bucket-to-midpoint numeric fields documented there.
version: "0.2.0"
vertical: insurance

rules:
  - id: INS-TIMING-001
    description: >
      Accident occurred within the first week of the policy being active —
      a well-known claims-fraud red flag that should not be auto-approved
      regardless of the model's score.
    source_regulation: >
      IRDAI (Insurance Fraud Monitoring Framework) Guidelines, 2025
      (IRDAI/IID/GDL/MISC/112/10/2025, 9 Oct 2025; in force 1 Apr 2026),
      para 5.4.1 — insurers must identify Red Flag Indicators for their lines
      of business. Early claim after inception is our chosen RFI.
    severity: hard
    basis: regulation
    verified: true
    reference_url: https://irdai.gov.in/document-detail?documentId=7948519
    verified_on: "2026-10-06"
    action: escalate
    condition:
      field: days_policy_to_accident
      op: lt
      value: 8

  - id: INS-HIGHVALUE-001
    description: >
      Vehicle price bucket is "more than 69000" — the highest-value claim
      bracket in this dataset should always get a human look.
    source_regulation: >
      Internal claims-authority policy — high-value claims always go to a
      human. Not a fraud indicator and not prescribed by IRDAI.
    severity: hard
    basis: internal_policy
    action: escalate
    condition:
      field: vehicle_price_midpoint
      op: gte
      value: 80000

  - id: INS-ADDRESS-001
    description: >
      Policyholder's address was changed shortly (within 6 months) before
      the claim — a recognized fraud indicator.
    source_regulation: >
      IRDAI (Insurance Fraud Monitoring Framework) Guidelines, 2025, para
      5.4.1 — insurer-defined Red Flag Indicator. Recent address change is
      our chosen RFI.
    severity: soft
    basis: regulation
    verified: true
    reference_url: https://irdai.gov.in/document-detail?documentId=7948519
    verified_on: "2026-10-06"
    action: annotate
    condition:
      field: address_change_recency_years
      op: lt
      value: 0.5

  - id: INS-PASTCLAIMS-001
    description: >
      Policyholder has more than 4 past claims — worth a note even if not
      independently disqualifying.
    source_regulation: >
      IRDAI (Insurance Fraud Monitoring Framework) Guidelines, 2025, para
      5.4.1 — insurer-defined Red Flag Indicator. Frequent claimant (more
      than 4 past claims) is our chosen RFI.
    severity: soft
    basis: regulation
    verified: true
    reference_url: https://irdai.gov.in/document-detail?documentId=7948519
    verified_on: "2026-10-06"
    action: annotate
    condition:
      field: past_claims_count
      op: gt
      value: 4

  - id: INS-NOEVIDENCE-001
    description: >
      Neither a police report nor a witness is on record for this claim.
    source_regulation: >
      IRDAI (Insurance Fraud Monitoring Framework) Guidelines, 2025, para
      5.4.1 — insurer-defined Red Flag Indicator. No corroborating evidence
      is our chosen RFI.
    severity: soft
    basis: regulation
    verified: true
    reference_url: https://irdai.gov.in/document-detail?documentId=7948519
    verified_on: "2026-10-06"
    action: annotate
    condition:
      all:
        - field: police_report_filed
          op: eq
          value: false
        - field: witness_present
          op: eq
          value: false
